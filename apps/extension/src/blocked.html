<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stay Focused — Matric Tracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 40px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background-color: rgba(34, 197, 94, 0.15);
      color: #22c55e;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 12px;
      line-height: 1.3;
    }
    p {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      background-color: #15803d;
      color: #ffffff;
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      transition: background-color 0.15s ease;
    }
    .btn:hover {
      background-color: #166534;
    }
    .footer-quote {
      margin-top: 30px;
      font-size: 12px;
      color: #64748b;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Matric Study Mode Active</div>
    <h1>Stay Focused on Your Goal</h1>
    <p>
      This website is restricted during your scheduled study session. Every focused minute brings you closer to mastering your Ethiopian Grade 12 curriculum.
    </p>
    <a href="http://localhost:3000" class="btn">Return to Matric Tracker</a>
    <div class="footer-quote">
      &ldquo;Small steps. Big progress.&rdquo;
    </div>
  </div>
</body>
</html>
